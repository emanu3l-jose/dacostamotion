# Site estático: publica a pasta inteira, sem build.
[build]
  publish = "."

# Página e painel sempre buscam a versão mais nova (evita ver versão antiga depois de publicar)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

# endereços limpos: /contato, /sobre, /projeto-1... abrem o site (arquivos reais têm prioridade)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
