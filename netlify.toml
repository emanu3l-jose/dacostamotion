# Site estático: publica a pasta inteira, sem build.
[build]
  publish = "."

# Página e painel sempre buscam a versão mais nova (evita ver versão antiga depois de publicar)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

# orçamentos: páginas privadas, fora do Google
[[headers]]
  for = "/o/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/painel-orcamento/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/orcamento/*"
  [headers.values]
    Cache-Control = "no-cache"

# link da proposta: dacostamotion.com/o/x7k2p9 (os dados vêm da função netlify/functions/orcamentos)
[[redirects]]
  from = "/o/*"
  to = "/orcamento/proposta.html"
  status = 200

# endereços limpos: /contato, /sobre, /projeto-1... abrem o site (arquivos reais têm prioridade)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
